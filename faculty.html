<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Faculty Directory | MCA Portal</title>
    <link

      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <i class="bi bi-mortarboard-fill me-2"></i>MCA Academic Portal

      <div class="sidebar-section">Student</div>
      <a data-nav="dashboard" href="dashboard.html"

      ><a data-nav="syllabus" href="syllabus.html"

      ><a data-nav="materials" href="materials.html"
        ><i class="bi bi-file-earmark-text"></i>Materials</a
      ><a data-nav="projects" href="projects.html"
        ><i class="bi bi-kanban"></i>Projects</a
      ><a data-nav="laboratory" href="laboratory.html"
        ><i class="bi bi-flask"></i>Laboratory</a
      ><a data-nav="marks" href="marks.html"
        ><i class="bi bi-bar-chart"></i>Marks</a
      ><a data-nav="timetable" href="timetable.html"

      ><a data-nav="faculty" href="faculty.html"

      ><a data-nav="announcements" href="announcements.html"

      ><a data-nav="events" href="events.html"

      <div class="border-top mt-3 pt-2">
        <a href="#" id="logout"><i class="bi bi-box-arrow-right"></i>Logout</a>

      <nav class="topbar navbar px-3">
        <button id="menuBtn" class="btn btn-outline-secondary mobile-menu">
          <i class="bi bi-list"></i>
        </button>
        <div class="ms-auto d-flex align-items-center gap-3">
          <div class="dropdown">
            <button
              class="btn btn-light position-relative"
              data-bs-toggle="dropdown"
            >
              <i class="bi bi-bell"></i
              ><span
                class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                >3</span
              >
            </button>
            <ul class="dropdown-menu dropdown-menu-end" id="notifications"></ul>
          </div>
          <div class="d-flex align-items-center gap-2">
            <div class="avatar" id="avatar">S</div>
            <div class="small-hide">
              <div class="fw-semibold" data-user-name></div>
              <div class="text-secondary small" data-role></div>
            </div>
          </div>
        </div>
      </nav>
      <div class="container-fluid p-4 content-wrap">
        <div class="small text-secondary">Home / Faculty Directory</div>
        <h2 class="page-title mt-1 mb-4">
          <i class="bi bi-people me-2 text-primary"></i>Faculty Directory
        </h2>
        <div class="mb-3">
          <input
            id="search"
            class="form-control"
            placeholder="Search faculty..."
          />
        </div>
        <div class="row g-3" id="facultyList"></div>
      </div>
      <footer class="px-4 py-3 text-secondary small">
        MCA Student Academic Portal • Demo Mode • MySQL schema provided
        separately

    <script src="data/demo-data.js"></script>
