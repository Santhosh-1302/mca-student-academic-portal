<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Profile | MCA Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <i class="bi bi-mortarboard-fill me-2"></i>MCA Academic Portal
      </div>
      <div class="sidebar-section">Student</div>
      <a data-nav="dashboard" href="dashboard.html"
        ><i class="bi bi-speedometer2"></i>Dashboard</a
      ><a data-nav="syllabus" href="syllabus.html"
        ><i class="bi bi-book"></i>Syllabus</a
      ><a data-nav="materials" href="materials.html"
        ><i class="bi bi-file-earmark-text"></i>Materials</a
      ><a data-nav="projects" href="projects.html"
        ><i class="bi bi-kanban"></i>Projects</a
      ><a data-nav="laboratory" href="laboratory.html"
        ><i class="bi bi-flask"></i>Laboratory</a
      ><a data-nav="marks" href="marks.html"
        ><i class="bi bi-bar-chart"></i>Marks</a
      ><a data-nav="timetable" href="timetable.html"
        ><i class="bi bi-calendar3"></i>Timetable</a
      ><a data-nav="faculty" href="faculty.html"
        ><i class="bi bi-people"></i>Faculty</a
      ><a data-nav="announcements" href="announcements.html"
        ><i class="bi bi-megaphone"></i>Announcements</a
      ><a data-nav="events" href="events.html"
        ><i class="bi bi-calendar-event"></i>Events</a
      ><a data-nav="profile" href="profile.html"
        ><i class="bi bi-person"></i>Profile</a
      >
      <div class="border-top mt-3 pt-2">
        <a href="#" id="logout"><i class="bi bi-box-arrow-right"></i>Logout</a>
      </div>
    </aside>
    <main class="main">
      <nav class="topbar navbar px-3">
        <button id="menuBtn" class="btn btn-outline-secondary mobile-menu">
          <i class="bi bi-list"></i>
        </button>
        <div class="ms-auto d-flex align-items-center gap-3">
          <div class="dropdown">
            <button
              class="btn btn-light position-relative"
              data-bs-toggle="dropdown"
            >
              <i class="bi bi-bell"></i
              ><span
                class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                >3</span
              >
            </button>
            <ul class="dropdown-menu dropdown-menu-end" id="notifications"></ul>
          </div>
          <div class="d-flex align-items-center gap-2">
            <div class="avatar" id="avatar">S</div>
            <div class="small-hide">
              <div class="fw-semibold" data-user-name></div>
              <div class="text-secondary small" data-role></div>
            </div>
          </div>
        </div>
      </nav>
      <div class="container-fluid p-4 content-wrap">
        <div class="small text-secondary">Home / My Profile</div>
        <h2 class="page-title mt-1 mb-4">
          <i class="bi bi-person me-2 text-primary"></i>My Profile
        </h2>
        <div class="row justify-content-center">
          <div class="col-lg-9">
            <div class="card p-4">
              <form id="profileForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Student Name</label
                    ><input id="pName" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Register Number</label
                    ><input id="pReg" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label
                    ><input id="pEmail" class="form-control" readonly />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone</label
                    ><input id="pPhone" class="form-control" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Date of Birth</label
                    ><input id="pDob" type="date" class="form-control" />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Semester</label
                    ><input
                      id="pSem"
                      type="number"
                      min="1"
                      max="8"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Section</label
                    ><input id="pSection" class="form-control" />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Gender</label
                    ><select id="pGender" class="form-select">
                      <option>Male</option>
                      <option>Female</option>
                      <option>Other</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Address</label
                    ><textarea
                      id="pAddress"
                      class="form-control"
                      rows="2"
                    ></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Skills</label
                    ><textarea
                      id="pSkills"
                      class="form-control"
                      rows="3"
                    ></textarea>
                  </div>
                  <div class="col-12">
                    <button class="btn btn-primary">Save Profile</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <footer class="px-4 py-3 text-secondary small">
        MCA Student Academic Portal • Demo Mode • MySQL schema provided
        separately
      </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data/demo-data.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/student.js"></script>
  </body>
</html>
