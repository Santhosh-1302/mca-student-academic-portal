<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | MCA Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body class="login-bg">
    <div class="container">
      <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card login-card p-4">
            <div class="text-center mb-4">
              <i class="bi bi-mortarboard-fill text-primary fs-1"></i>
              <h3 class="fw-bold mt-2">MCA Portal</h3>
              <p class="text-secondary">Sign in to continue</p>
            </div>
            <div id="loginAlert"></div>
            <form id="loginForm">
              <label class="form-label">Email / Username</label
              ><input
                id="email"
                class="form-control mb-3"
                placeholder="student@mca.edu"
                required
              />
              <label class="form-label">Password</label>
              <div class="input-group mb-3">
                <input
                  id="password"
                  type="password"
                  class="form-control"
                  required
                /><button
                  type="button"
                  class="btn btn-outline-secondary"
                  id="togglePassword"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <label class="form-label">Role</label
              ><select id="role" class="form-select mb-3" required>
                <option value="student">Student</option>
                <option value="professor">Professor</option>
                <option value="admin">Admin</option>
              </select>
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="remember"
                /><label class="form-check-label">Remember me</label>
              </div>
              <button class="btn btn-primary w-100">Login</button>
            </form>
            <div class="small text-secondary mt-4"><b>Demo credentials</b><br>Student: student@mca.edu / Student@123<br>Professor: professor@mca.edu / Professor@123<br>Admin: admin@mca.edu / Admin@123</div>
          </div>
        </div>
      </div>
    </div>
    <script src="data/demo-data.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
